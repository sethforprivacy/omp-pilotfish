name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate marketplace catalog + plugin integrity
        run: node scripts/validate-marketplace.mjs

      - name: Build plugin archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "artifact=pilotfish-${VERSION}.zip" >> "$GITHUB_ENV"
          zip -r "pilotfish-${VERSION}.zip" plugins/pilotfish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
