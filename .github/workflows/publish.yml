name: publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Validate marketplace catalog + plugin integrity
        run: node scripts/validate-marketplace.mjs

      - name: Build plugin archive
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "artifact=pilotfish-${VERSION}.zip" >> "$GITHUB_ENV"
          zip -r "pilotfish-${VERSION}.zip" plugins/pilotfish

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: ${{ env.artifact }}
          generate_release_notes: true
